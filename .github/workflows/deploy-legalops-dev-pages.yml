name: Deploy legalops.dev Pages

on:
  push:
    branches: [main]
    paths:
      - 'design/**'
      - 'scripts/sync-design-system.mjs'
      - 'cloudflare-landing/**'
      - '.github/workflows/deploy-legalops-dev-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 3d40d7797b3fd6d1cd2644eefea9e907
      CLOUDFLARE_PAGES_PROJECT: legalops-dev
    steps:
      - uses: actions/checkout@v6

      - name: Check shared design system
        run: node scripts/sync-design-system.mjs --check

      - name: Deploy static landing
        id: deploy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest pages deploy cloudflare-landing \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch=main \
            --commit-hash="$GITHUB_SHA"

      - name: Record Pages deploy status
        if: always()
        run: |
          printf 'commit=%s\noutcome=%s\nrun_id=%s\nproject=%s\n' \
            "$GITHUB_SHA" \
            "${{ steps.deploy.outcome }}" \
            "$GITHUB_RUN_ID" \
            "$CLOUDFLARE_PAGES_PROJECT" \
            > .github/cloudflare-pages-deploy-status.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/cloudflare-pages-deploy-status.txt
          git diff --cached --quiet || git commit -m 'chore: record Pages deploy status [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Fail if deploy failed
        if: steps.deploy.outcome != 'success'
        run: exit 1
