name: Test document collaboration
on:
  push:
    branches: [main]
    paths: ['collaboration/**', 'components/contract-map/**', 'lib/contract-map.ts', 'lib/map-diff.ts', 'app/api/community/contract-map/**', '__tests__/*map*', 'package-lock.json', '.github/workflows/test-document-collaboration.yml']
  pull_request:
    paths: ['collaboration/**', 'components/contract-map/**', 'lib/contract-map.ts', 'lib/map-diff.ts', 'app/api/community/contract-map/**', '__tests__/*map*', 'package-lock.json', '.github/workflows/test-document-collaboration.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:collaboration
