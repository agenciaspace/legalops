name: Deploy Cloudflare Worker
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 3d40d7797b3fd6d1cd2644eefea9e907
      CLOUDFLARE_WORKER_NAME: legalops-club-proxy
    steps:
      - uses: actions/checkout@v6

      - id: deploy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          HTTP_CODE=$(curl -sS -o /tmp/cloudflare-response.json -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F 'metadata={"main_module":"legalops-club-proxy.js","compatibility_date":"2026-08-13"};type=application/json' \
            -F 'legalops-club-proxy.js=@cloudflare/legalops-club-proxy.js;filename=legalops-club-proxy.js;type=application/javascript+module' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CLOUDFLARE_WORKER_NAME")

          SUCCESS=$(jq -r '.success // false' /tmp/cloudflare-response.json 2>/dev/null)
          {
            echo "http_status=$HTTP_CODE"
            echo "success=$SUCCESS"
            jq -r '.errors[]? | "error=\(.code): \(.message)"' /tmp/cloudflare-response.json 2>/dev/null || true
          } > .github/cloudflare-api-result.txt

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] && [ "$SUCCESS" = "true" ]; then
            exit 0
          fi
          exit 1

      - name: Record deploy status
        if: always()
        run: |
          printf 'commit=%s\noutcome=%s\nrun_id=%s\n' "$GITHUB_SHA" "${{ steps.deploy.outcome }}" "$GITHUB_RUN_ID" > .github/cloudflare-deploy-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/cloudflare-deploy-status.txt .github/cloudflare-api-result.txt
          git diff --cached --quiet || git commit -m 'chore: record Cloudflare deploy status [skip ci]'
          git push
