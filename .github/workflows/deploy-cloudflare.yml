name: Deploy Cloudflare Worker
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config cloudflare/wrangler.jsonc

      - name: Record deploy status
        if: always()
        run: |
          printf 'commit=%s\noutcome=%s\nrun_id=%s\n' "$GITHUB_SHA" "${{ steps.deploy.outcome }}" "$GITHUB_RUN_ID" > .github/cloudflare-deploy-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/cloudflare-deploy-status.txt
          git diff --cached --quiet || git commit -m 'chore: record Cloudflare deploy status [skip ci]'
          git push
