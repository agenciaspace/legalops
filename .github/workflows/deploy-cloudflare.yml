name: Deploy Cloudflare Workers
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'public/**'
      - 'lib/**'
      - 'middleware.ts'
      - 'scripts/verify-public-auth-build.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'open-next.config.ts'
      - 'next.config.mjs'
      - 'cloudflare/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 3d40d7797b3fd6d1cd2644eefea9e907
      # Next.js embeds these public values in browser bundles at build time.
      NEXT_PUBLIC_SUPABASE_URL: https://dkjcvemtkxqweagrdmop.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Cc0Bp-tFHkL0EH2htwJ3gA_trJ-UU8Q
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext worker
        id: build
        continue-on-error: true
        run: |
          npm run build:cloudflare
          node scripts/verify-public-auth-build.mjs

      - name: Deploy application Worker
        if: steps.build.outcome == 'success'
        id: deploy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:cloudflare

      - name: Deploy cron Worker
        id: deploy_cron
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config cloudflare/legalops-cron.wrangler.jsonc

      - name: Deploy inbound email Worker
        id: deploy_inbound
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config cloudflare/email-inbound.wrangler.jsonc

      - name: Verify public club routing
        id: smoke
        continue-on-error: true
        run: |
          set -euo pipefail
          for host in legalops.club www.legalops.club; do
            body=$(curl -fsSL --retry 5 --retry-delay 2 \
              -H 'Cache-Control: no-cache' \
              "https://${host}/?brandcheck=${GITHUB_RUN_ID}")
            printf '%s' "$body" | grep -q 'comunidade para profissionais do jurídico'
            printf '%s' "$body" | grep -q 'aria-label="legalops.club"'
            if printf '%s' "$body" | grep -q 'LEGALOPS.WORK / VAGAS'; then
              echo "${host} is still serving the Work landing" >&2
              exit 1
            fi
          done
          icon=$(curl -fsS --retry 5 --retry-delay 2 "https://legalops.club/icon.svg?brandcheck=${GITHUB_RUN_ID}")
          printf '%s' "$icon" | grep -q '<svg'

      - name: Record deploy status
        if: always()
        run: |
          printf 'commit=%s\nbuild=%s\napp_deploy=%s\ncron_deploy=%s\ninbound_deploy=%s\npublic_smoke=%s\nrun_id=%s\n' \
            "$GITHUB_SHA" \
            "${{ steps.build.outcome }}" \
            "${{ steps.deploy.outcome }}" \
            "${{ steps.deploy_cron.outcome }}" \
            "${{ steps.deploy_inbound.outcome }}" \
            "${{ steps.smoke.outcome }}" \
            "$GITHUB_RUN_ID" \
            > .github/cloudflare-deploy-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/cloudflare-deploy-status.txt
          git diff --cached --quiet || git commit -m 'chore: record Cloudflare deploy status [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Fail if Cloudflare deployment failed
        if: steps.build.outcome != 'success' || steps.deploy.outcome != 'success' || steps.deploy_cron.outcome != 'success' || steps.deploy_inbound.outcome != 'success' || steps.smoke.outcome != 'success'
        run: exit 1